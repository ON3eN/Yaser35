<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - شقف</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(to bottom right, #d8f0ff, #ffffff);
      color: #1e1e1e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
      position: relative;
      font-family: 'Cairo', sans-serif;
    }

    .home-link {
      display: inline-block;
      padding: 0.4rem 1rem;
      border: 1px solid #bbb;
      border-radius: 8px;
      text-align: center;
      color: #1565c0;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      margin-bottom: 1rem;
      display: block;
      font-family: 'Cairo', sans-serif;
    }

    .home-link:hover {
      background-color: #e3f2fd;
      transform: translateY(-2px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #1565c0;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      background-color: #f0f8ff;
      font-family: 'Cairo', sans-serif;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      background-color: #1565c0;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
      font-family: 'Cairo', sans-serif;
    }

    button:hover {
      background-color: #0d47a1;
    }

    .links {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .links a {
      color: #1565c0;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .messages {
      text-align: center;
      margin-bottom: 1rem;
    }

    .messages p {
      margin: 0.3rem 0;
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .messages .error {
      background-color: #ffd4d4;
      color: #c62828;
    }

    .messages .success {
      background-color: #c8f7c5;
      color: #2e7d32;
    }

  </style>
</head>
<body>
  <div class="login-container">
    <a class="home-link" href="{% url 'home' %}">الرئيسية</a>

    <h2>تسجيل الدخول</h2>

    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <p class="{{ message.tags }}">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="text" name="username" placeholder="اسم المستخدم أو البريد الإلكتروني" required />
      <input type="password" name="password" placeholder="كلمة المرور" required />
      <button type="submit">تسجيل الدخول</button>
    </form>

    <div class="links">
      <a href="#">نسيت كلمة المرور؟</a> |
      <a href="{% url 'account:register' %}">إنشاء حساب</a>
    </div>
  </div>
</body>
</html>
