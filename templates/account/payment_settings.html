<!DOCTYPE html>

<head>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(to bottom right, #d8f0ff, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;

    .message-box {

    .message-box h2 {
      font-size: 1.8rem;
      color: #005b8f;
      margin-bottom: 1rem;
    }

    .message-box p {
      font-size: 1.1rem;
      color: #444;

<body>

  <div class="message-box">
    <h2>🚧 إعدادات الدفع</h2>
    <p>نحن نقوم حالياً بصيانة إعدادات الدفع، الرجاء العودة لاحقاً.</p>

</html>
