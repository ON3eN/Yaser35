<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إنشاء حساب - شقف</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(to bottom right, #d8f0ff, #ffffff);
      color: #1e1e1e;
    }

    .register-container {
      max-width: 450px;
      margin: 4rem auto;
      padding: 2rem;
      background: white;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      color: #1565c0;
      margin-bottom: 1.5rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      background-color: #1565c0;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0d47a1;
    }

    .links {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .links a {
      color: #1565c0;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h2>إنشاء حساب جديد</h2>
    <form method="post">
      {% csrf_token %}
      <input type="text" name="username" placeholder="اسم المستخدم" required />
      <input type="email" name="email" placeholder="البريد الإلكتروني" required />
      <input type="tel" name="phone" value="+966" placeholder="رقم الجوال" required />
      <input type="password" name="password" placeholder="كلمة المرور" required />
      <input type="password" name="confirm_password" placeholder="إعادة كلمة المرور" required />
      <button type="submit">إنشاء الحساب</button>
    </form>
    <div class="links">
      <a href="{% url 'account:login' %}">لديك حساب؟ تسجيل الدخول</a>
    </div>
  </div>
</body>
</html>
