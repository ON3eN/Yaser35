<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب - شقف</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(to bottom right, #d8f0ff, #ffffff);
      color: #1e1e1e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .register-container {
      width: 90%;
      max-width: 450px;
      padding: 2rem;
      background: white;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
    }

    .home-link {
      text-align: center;
      border: 1px solid #ccc;
      padding: 0.4rem 1rem;
      width: fit-content;
      margin: 0 auto 1rem;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .home-link:hover {
      background-color: #f0f8ff;
      color: #1565c0;
      font-weight: bold;
    }

    h2 {
      text-align: center;
      color: #1565c0;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }

    input, select {
      font-family: 'Cairo', sans-serif;
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      background-color: #f0f8ff;
    }

    .phone-group {
      display: flex;
      flex-direction: row-reverse;
      gap: 0.5rem;
      align-items: center;
    }

    .phone-group select {
      flex: 1.3;
      padding: 0.75rem;
      direction: ltr;
      text-align: right;
    }

    .phone-group input[type="tel"] {
      flex: 2;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      background-color: #1565c0;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #0d47a1;
    }

    .links {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .links a {
      color: #1565c0;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .messages {
      text-align: center;
      margin-bottom: 1rem;
    }

    .messages p {
      margin: 0.3rem 0;
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .messages .error {
      background-color: #ffd4d4;
      color: #c62828;
    }

    .messages .success {
      background-color: #c8f7c5;
      color: #2e7d32;
    }
  </style>

  <script>
    function limitPhoneLength(select) {
      const input = document.querySelector('input[name="phone"]');
      const code = select.value;

      let maxLength = 15;
      if (code === '+966') maxLength = 9;
      else if (code === '+20') maxLength = 10;
      else if (code === '+971') maxLength = 9;
      else if (code === '+1') maxLength = 10;
      else if (code === '+964') maxLength = 10;
      else if (code === '+965') maxLength = 8;
      else if (code === '+44') maxLength = 10;
      else if (code === '+91') maxLength = 10;

      input.maxLength = maxLength;
      input.value = ''; // إعادة ضبط الحقل عند التبديل
    }
  </script>
</head>

<body>
  <div class="register-container">
    <div class="home-link">
      <a href="/" style="text-decoration: none; color: inherit;">الرئيسية</a>
    </div>

    <h2>إنشاء حساب جديد</h2>

    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <p class="{{ message.tags }}">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="text" name="username" placeholder="اسم المستخدم" required />
      <input type="email" name="email" placeholder="البريد الإلكتروني" required />

      <div class="phone-group">
        <input type="tel" name="phone" placeholder="رقم الجوال" required />
        <select name="country_code" onchange="limitPhoneLength(this)" required>
          <option value="+966" selected>🇸🇦 +966</option>
          <option value="+20">🇪🇬 +20</option>
          <option value="+971">🇦🇪 +971</option>
          <option value="+965">🇰🇼 +965</option>
          <option value="+964">🇮🇶 +964</option>
          <option value="+1">🇺🇸 +1</option>
          <option value="+44">🇬🇧 +44</option>
          <option value="+91">🇮🇳 +91</option>
        </select>
      </div>

      <input type="password" name="password" placeholder="كلمة المرور" required />
      <input type="password" name="confirm_password" placeholder="إعادة كلمة المرور" required />
      <button type="submit">إنشاء الحساب</button>
    </form>

    <div class="links">
      <a href="{% url 'account:login' %}">لديك حساب؟ تسجيل الدخول</a>
    </div>
  </div>
</body>
</html>
