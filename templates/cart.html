<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>سلة المشتريات 🛒</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(to bottom, #d6f0fc, #ffffff);
      color: #1e1e1e;
    }

    .container {
      max-width: 700px;
      margin: 4rem auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      padding: 2rem;
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: #0077aa;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .item-name {
      font-weight: bold;
      color: #333;
      font-size: 1rem;
    }

    .item-price {
      color: #0077aa;
      font-weight: bold;
      font-size: 1rem;
    }

    .empty {
      text-align: center;
      color: #888;
      font-size: 1.1rem;
      padding: 2rem 0;
    }

    .total {
      text-align: center;
      font-size: 1.3rem;
      margin-top: 2rem;
      color: #0077aa;
    }

    .checkout-btn {
      display: block;
      margin: 2rem auto 0;
      background: #0077aa;
      color: white;
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .checkout-btn:hover {
      background: #005f88;
    }
  </style>
</head>
<body>

  {% include 'header.html' %}

  <div class="container">
    <h2>🛍️ سلة المشتريات</h2>

    {% if cart_items %}
      {% for item in cart_items %}
        <div class="cart-item">
          <span class="item-name">{{ item.name }}</span>
          <span class="item-price">{{ item.price }} ر.س</span>
        </div>
      {% endfor %}

      <div class="total">المجموع: <strong>{{ total }} ر.س</strong></div>
      <form action="{% url 'order:checkout' %}" method="post">
  {% csrf_token %}
  <button class="checkout-btn">إتمام الشراء</button>
</form>

    {% else %}
      <div class="empty">سلتك فارغة حاليًا 😕</div>
    {% endif %}
  </div>

  {% include 'footer.html' %}

</body>
</html>
