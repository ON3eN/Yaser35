<!-- templates/products.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>كل المنتجات - شقف</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f0faff;
      color: #1e1e1e;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 2rem;
      padding: 3rem 2rem;
      max-width: 1200px;
      margin: auto;
    }

    .product-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 1.5rem;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-card img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product-card h3 {
      margin: 0.5rem 0;
      color: #0077b6;
    }

    .product-card p {
      color: #333;
      font-size: 0.95rem;
      margin: 0.3rem 0;
    }

    .product-price {
      color: #0077b6;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 0.5rem;
    }

    .add-to-cart {
      margin-top: 1rem;
      background: #0077b6;
      color: white;
      font-family: 'Cairo', sans-serif;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .add-to-cart:hover {
      background: #005b8f;
      transform: scale(1.05);
    }

    .no-products {
      text-align: center;
      font-size: 1.2rem;
      color: #888;
      padding: 2rem;
    }

    /* زر السلة العائم بنفس شكل الهوم */
    .cart-float {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: #0077b6;
      color: white;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 0.8rem 1.8rem 0.8rem 3.2rem;
      border-radius: 50px;
      text-decoration: none;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      transition: all 0.4s ease;
      z-index: 9999;
    }

    .cart-float.show {
      display: flex;
      animation: bounceIn 0.5s ease;
    }

    .cart-float .cart-count {
      position: absolute;
      top: -10px;
      left: -10px;
      background: #0d47a1;
      color: white;
      font-size: 0.9rem;
      font-weight: bold;
      padding: 0.3rem 0.75rem;
      border-radius: 50px;
      box-shadow: 0 0 0 4px #ffffff;
    }

    @keyframes bounceIn {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  {% include 'header.html' %}

  <!-- زر السلة العائم -->
  <a href="{% url 'cart:cart' %}" id="cartFloat" class="cart-float">
    🛒 سلة التسوق
    <span id="cartCount" class="cart-count">1</span>
  </a>

  <section class="products" id="products">
    {% for product in products %}
      <div class="product-card">
        {% if product.image %}
          <img src="{{ product.image.url }}" alt="{{ product.name }}">
        {% else %}
          <img src="/static/images/default-product.png" alt="منتج بدون صورة">
        {% endif %}
        <h3>{{ product.name }}</h3>
        <p>{{ product.description }}</p>
        <p class="product-price">{{ product.price }} ريال</p>
        <button class="add-to-cart" data-url="{% url 'cart:ajax_add_to_cart' product.id %}">أضف للسلة 🛒</button>
      </div>
    {% empty %}
      <div class="no-products">
        لا توجد منتجات حالياً، تابعنا لاحقاً!
      </div>
    {% endfor %}
  </section>

  {% include 'footer.html' %}

  <script>
    function getCSRFToken() {
      const name = 'csrftoken';
      const cookies = document.cookie.split(';');
      for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + '=')) {
          return decodeURIComponent(cookie.substring(name.length + 1));
        }
      }
      return '';
    }

    function showCartFloat(count = 1) {
      const floatBtn = document.getElementById("cartFloat");
      const countSpan = document.getElementById("cartCount");
      countSpan.textContent = count;
      floatBtn.classList.add("show");

      setTimeout(() => {
        floatBtn.classList.remove("show");
      }, 10000);
    }

    document.querySelectorAll('.add-to-cart').forEach(button => {
      button.addEventListener('click', function(e) {
        e.preventDefault();
        const url = this.getAttribute('data-url');

        fetch(url, {
          method: 'POST',
          headers: {
            'X-CSRFToken': getCSRFToken(),
            'Content-Type': 'application/json'
          },
        })
        .then(response => response.json())
        .then(data => {
          showCartFloat(data.cartCount || 1);
        })
        .catch(error => {
          console.error("خطأ في الإضافة:", error);
        });
      });
    });
  </script>
</body>
</html>
