<!-- templates/products.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>كل المنتجات - شقف</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f0faff;
      color: #1e1e1e;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 2rem;
      padding: 3rem 2rem;
      max-width: 1200px;
      margin: auto;
    }

    .product-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 1.5rem;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-card img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product-card h3 {
      margin: 0.5rem 0;
      color: #0077b6;
    }

    .product-card p {
      color: #333;
      font-size: 0.95rem;
      margin: 0.3rem 0;
    }

    .product-price {
      color: #0077b6;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 0.5rem;
    }

    .add-to-cart {
      margin-top: 1rem;
      background: #0077b6;
      color: white;
      font-family: 'Cairo', sans-serif;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .add-to-cart:hover {
      background: #005b8f;
      transform: scale(1.05);
    }

    .no-products {
      text-align: center;
      font-size: 1.2rem;
      color: #888;
      padding: 2rem;
    }

    #cart-float-button {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: #0077b6;
      color: white;
      border-radius: 50px;
      padding: 0.6rem 1.2rem;
      font-family: 'Cairo', sans-serif;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: none;
      align-items: center;
      gap: 0.5rem;
      z-index: 9999;
    }

    @keyframes bounceIn {
      0% { transform: translateY(50px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  {% include 'header.html' %}

  <section class="products" id="products">
    {% for product in products %}
      <div class="product-card">
        {% if product.image %}
          <img src="{{ product.image.url }}" alt="{{ product.name }}">
        {% else %}
          <img src="/static/images/default-product.png" alt="منتج بدون صورة">
        {% endif %}
        <h3>{{ product.name }}</h3>
        <p>{{ product.description }}</p>
        <p class="product-price">{{ product.price }} ريال</p>
        <button class="add-to-cart" data-url="{% url 'cart:ajax_add_to_cart' product.id %}">أضف للسلة 🛒</button>
      </div>
    {% empty %}
      <div class="no-products">
        لا توجد منتجات حالياً، تابعنا لاحقاً!
      </div>
    {% endfor %}
  </section>

  <a href="/cart/" id="cart-float-button">سلة التسوق 🛒 <span id="cart-count">0</span></a>

  {% include 'footer.html' %}

  <script>
    function getCSRFToken() {
      const name = 'csrftoken';
      const cookies = document.cookie.split(';');
      for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + '=')) {
          return decodeURIComponent(cookie.substring(name.length + 1));
        }
      }
      return '';
    }

    function updateCartAnimation() {
      const cartBtn = document.getElementById('cart-float-button');
      let countSpan = document.getElementById('cart-count');
      let current = parseInt(countSpan.innerText) || 0;
      countSpan.innerText = current + 1;

      cartBtn.style.display = 'flex';
      cartBtn.style.animation = 'bounceIn 0.5s ease';

      setTimeout(() => {
        cartBtn.style.opacity = '0';
        cartBtn.style.transition = 'opacity 0.5s ease';
      }, 9500);

      setTimeout(() => {
        cartBtn.style.display = 'none';
        cartBtn.style.opacity = '1';
      }, 10000);
    }

    document.querySelectorAll('.add-to-cart').forEach(button => {
      button.addEventListener('click', function(e) {
        e.preventDefault();
        const url = this.getAttribute('data-url');

        fetch(url, {
          method: 'POST',
          headers: {
            'X-CSRFToken': getCSRFToken(),
            'Content-Type': 'application/json'
          },
        })
        .then(response => response.json())
        .then(data => {
          updateCartAnimation();
        })
        .catch(error => {
          console.error("خطأ في الإضافة:", error);
        });
      });
    });
  </script>
</body>
</html>
